<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Util Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141b;
    --bg-raise:#171c26;
    --bg-press:#1e2533;
    --line:#262e3e;
    --text:#e8ecf3;
    --text-dim:#8b94a6;
    --t-accent:#ddb243;   /* terrorist gold */
    --ct-accent:#6e9ecf;  /* counter-terrorist blue */
    --accent:#9aa4b5;     /* neutral until a side is picked */
    --danger:#d4604f;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overscroll-behavior-y:none;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  body[data-side="t"]{--accent:var(--t-accent)}
  body[data-side="ct"]{--accent:var(--ct-accent)}

  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 10px;
    background:linear-gradient(var(--bg) 75%, transparent);
  }
  .back{
    flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:11px;
    background:var(--bg-raise);color:var(--text);font-size:18px;line-height:1;
    display:none;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s;
  }
  .back:active{background:var(--bg-press)}
  body.can-go-back .back{display:flex}
  .crumbs{min-width:0}
  .crumbs .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);
  }
  .crumbs h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;
    letter-spacing:.02em;text-transform:uppercase;line-height:1.05;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  main{flex:1;padding:6px 16px 32px}

  /* ---------- screens & transitions ---------- */
  .screen{display:none;animation:slide .22s ease both}
  .screen.active{display:block}
  @keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}

  /* ---------- map list ---------- */
  .map-row{
    position:relative;overflow:hidden;
    width:100%;display:flex;align-items:center;gap:14px;
    background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 18px;margin-bottom:10px;cursor:pointer;color:var(--text);
    text-align:left;transition:background .15s,border-color .15s,transform .12s;
    min-height:84px;
  }
  .map-row .cover{
    position:absolute;inset:0;z-index:0;
    background-size:cover;background-position:center;
    opacity:0;transition:opacity .3s;
  }
  .map-row.has-cover .cover{opacity:1}
  /* dark gradient so white text stays readable over any image */
  .map-row.has-cover::after{
    content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg, rgba(16,20,27,.92) 0%, rgba(16,20,27,.72) 45%, rgba(16,20,27,.45) 100%);
  }
  .map-row > *{position:relative;z-index:2}
  .map-row:active{transform:scale(.99)}
  .map-glyph{
    flex:none;width:46px;height:46px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;
    background:rgba(30,37,51,.7);color:var(--text);border:1px solid var(--line);
    backdrop-filter:blur(2px);
  }
  .map-row.has-cover .map-glyph{display:none}
  .map-name{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:25px;
    letter-spacing:.04em;text-transform:uppercase;
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
  .map-count{
    margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
    text-shadow:0 1px 6px rgba(0,0,0,.7);
  }

  /* ---------- side picker ---------- */
  .sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .side-card{
    border-radius:var(--radius);border:1px solid var(--line);background:var(--bg-raise);
    padding:30px 14px 24px;cursor:pointer;color:var(--text);text-align:center;
    transition:transform .12s,border-color .15s;
  }
  .side-card:active{transform:scale(.97)}
  .side-card .badge{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1;
  }
  .side-card.t .badge{color:var(--t-accent)}
  .side-card.ct .badge{color:var(--ct-accent)}
  .side-card .label{margin-top:8px;font-size:13px;color:var(--text-dim)}
  .side-card.t:active{border-color:var(--t-accent)}
  .side-card.ct:active{border-color:var(--ct-accent)}

  /* ---------- clip list (collapsible groups) ---------- */
  .group{
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--bg-raise);margin-bottom:10px;overflow:hidden;
  }
  .group-head{
    width:100%;display:flex;align-items:center;gap:12px;
    padding:16px;background:transparent;border:0;color:var(--text);cursor:pointer;
    text-align:left;transition:background .15s;
  }
  .group-head:active{background:var(--bg-press)}
  .group-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
    letter-spacing:.05em;text-transform:uppercase;
  }
  .group-meta{
    margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--text-dim);background:var(--bg-press);border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;
  }
  .group-arrow{
    flex:none;color:var(--accent);font-size:13px;transition:transform .2s;
    transform:rotate(0deg);
  }
  .group.open .group-arrow{transform:rotate(90deg)}
  .group-body{
    display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease;
  }
  .group.open .group-body{grid-template-rows:1fr}
  .group-body > *{overflow:hidden;min-height:0}
  @media (prefers-reduced-motion:reduce){.group-body{transition:none}}
  .clip-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-press);border:1px solid var(--line);border-radius:11px;
    padding:13px;margin:0 10px 8px;cursor:pointer;color:var(--text);text-align:left;
    transition:filter .15s;
  }
  .clip-row:first-child{margin-top:2px}
  .clip-row:active{filter:brightness(1.25)}
  .tag{
    flex:none;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
    letter-spacing:.12em;padding:5px 8px;border-radius:6px;
    border:1px solid var(--accent);color:var(--accent);min-width:58px;text-align:center;
  }
  .clip-name{font-size:15px;font-weight:500;line-height:1.3}
  .chev{margin-left:auto;color:var(--text-dim);font-size:16px}
  .empty{
    margin-top:36px;text-align:center;color:var(--text-dim);font-size:14px;line-height:1.6;
    padding:0 12px;
  }
  .empty code{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);
    background:var(--bg-raise);padding:2px 6px;border-radius:6px;
  }

  /* ---------- player ---------- */
  .player-wrap{margin-top:6px}
  video{
    width:100%;border-radius:var(--radius);background:#000;
    border:1px solid var(--line);display:block;aspect-ratio:16/9;
  }
  .player-meta{display:flex;align-items:center;gap:10px;margin-top:14px}
  .player-meta .tag{min-width:58px}
  .player-title{font-size:16px;font-weight:600}
  .replay{
    margin-top:18px;width:100%;padding:15px;border-radius:var(--radius);
    border:1px solid var(--accent);background:transparent;color:var(--accent);
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
    letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
    transition:background .15s;
  }
  .replay:active{background:var(--bg-press)}
  .vid-error{
    margin-top:12px;border:1px solid var(--danger);border-radius:var(--radius);
    padding:14px;color:var(--danger);font-size:13px;line-height:1.55;display:none;
  }
  .vid-error code{font-family:'JetBrains Mono',monospace;font-size:12px}

  button:focus-visible,.map-row:focus-visible,.clip-row:focus-visible,.side-card:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn" aria-label="Back">&#8592;</button>
    <div class="crumbs">
      <div class="eyebrow" id="crumb">UTIL BOOK</div>
      <h1 id="title">Maps</h1>
    </div>
  </header>
  <main>
    <section class="screen active" id="screen-maps"></section>
    <section class="screen" id="screen-side">
      <div class="sides">
        <button class="side-card t" data-side="t"><div class="badge">T</div><div class="label">Terrorist</div></button>
        <button class="side-card ct" data-side="ct"><div class="badge">CT</div><div class="label">Counter-Terrorist</div></button>
      </div>
    </section>
    <section class="screen" id="screen-clips"></section>
    <section class="screen" id="screen-player">
      <div class="player-wrap">
        <video id="vid" playsinline controls loop preload="metadata"></video>
        <div class="vid-error" id="vidError"></div>
        <div class="player-meta"><span class="tag" id="pTag"></span><span class="player-title" id="pTitle"></span></div>
        <button class="replay" id="replayBtn">&#8635;&nbsp; Replay</button>
      </div>
    </section>
  </main>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   EDIT THIS SECTION ONLY — your maps and clips live here.

   1. Trim your SteelSeries GG clip to ~10s and export as .mp4
   2. Put the file in:  videos/<map>/<side>/your-file.mp4
   3. Add one line below under the right map + side:
        { name:"A execute from ramp", tag:"EXEC", group:"A site", file:"a-execute-ramp.mp4" }

   tag   = small chip shown on the row (SMOKE, FLASH, MOLLY, HE, EXEC, NADE — anything)
   group = optional heading the clip is sorted under (e.g. "A site", "Mid", "B site")
   file  = filename inside videos/<map>/<side>/
   ════════════════════════════════════════════════════════════════ */

const MAPS = ["Mirage","Inferno","Nuke","Ancient","Anubis","Dust II","Overpass"];

const CLIPS = {
  "Mirage": {
    t: [
      { name:"Balcony molotov",            tag:"MOLLY", group:"A apps",    file:"a-apps/balcony-molotov.mp4" },
      { name:"Pop flash",                  tag:"FLASH", group:"A apps",    file:"a-apps/pop-flash.mp4" },
      { name:"B smoke execute",            tag:"SMOKE", group:"B apps",    file:"b-apps/b-smoke-execute.mp4" },
      { name:"Market window smoke",        tag:"SMOKE", group:"B site",    file:"b-site/market-window-smoke.mp4" },
      { name:"Window pop flash",           tag:"FLASH", group:"Mid",       file:"mid/window-pop-flash.mp4" },
      { name:"Flash combo",                tag:"FLASH", group:"Ramp",      file:"ramp/flash-combo.mp4" },
      { name:"Stair smoke",                tag:"SMOKE", group:"Ramp",      file:"ramp/stair-smoke.mp4" },
      { name:"B rush smoke combo",         tag:"SMOKE", group:"Spawn",     file:"spawn/b-rush-smoke-combo.mp4" },
      { name:"Connector smoke 1",          tag:"SMOKE", group:"Spawn",     file:"spawn/connector-smoke-1.mp4" },
      { name:"Connector smoke 2",          tag:"SMOKE", group:"Spawn",     file:"spawn/connector-smoke-2.mp4" },
      { name:"Fast start jungle smokes",   tag:"SMOKE", group:"Spawn",     file:"spawn/fast-start-jungle-smokes.mp4" },
      { name:"Instant window spawn 1",     tag:"SMOKE", group:"Spawn",     file:"spawn/instant-window-spawn-1.mp4" },
      { name:"Instant window spawn 2",     tag:"SMOKE", group:"Spawn",     file:"spawn/instant-window-spawn-2.mp4" },
      { name:"Instant window spawn 3",     tag:"SMOKE", group:"Spawn",     file:"spawn/instant-window-spawn-3.mp4" },
      { name:"Instant window spawn 4",     tag:"SMOKE", group:"Spawn",     file:"spawn/instant-window-spawn-4.mp4" },
      { name:"Instant window spawn 5",     tag:"SMOKE", group:"Spawn",     file:"spawn/instant-window-spawn-5.mp4" },
      { name:"Short smoke",                tag:"SMOKE", group:"Spawn",     file:"spawn/short-smoke.mp4" },
      { name:"Top mid smoke",              tag:"SMOKE", group:"Spawn",     file:"spawn/top-mid-smoke.mp4" },
      { name:"Short smoke",                tag:"SMOKE", group:"Top mid",   file:"top-mid/short-smoke.mp4" },
      { name:"Top con smoke",              tag:"SMOKE", group:"Top mid",   file:"top-mid/top-con-smoke.mp4" },
      { name:"Under molotov",              tag:"MOLLY", group:"Top mid",   file:"top-mid/under-molotov.mp4" },
      { name:"Window molotov",             tag:"MOLLY", group:"Top mid",   file:"top-mid/window-molotov.mp4" },
      { name:"Underpass pop flash",        tag:"FLASH", group:"Underpass", file:"underpass/underpass-pop-flash.mp4" },
    ],
    ct: [
      { name:"Ramp molotov",               tag:"MOLLY", group:"A site",              file:"a-site/ramp-molotov.mp4" },
      { name:"Underpass pop flash",        tag:"FLASH", group:"A site \u00b7 Connector", file:"a-site/connector/underpass-pop-flash.mp4" },
      { name:"Top mid molotov",            tag:"MOLLY", group:"Window",              file:"window/top-mid-molotov.mp4" },
      { name:"Window nade brake",          tag:"NADE",  group:"Window",              file:"window/window-nade-brake.mp4" },
      { name:"Window pop flash",           tag:"FLASH", group:"Window",              file:"window/window-pop-flash.mp4" },
    ],
  },
  "Inferno": {
    t: [
      { name:"Apps lurk smoke",       tag:"SMOKE", group:"Apps",       file:"Apps/apps-lurk-smoke.mp4" },
      { name:"Banana combo car nade", tag:"NADE",  group:"Banana",     file:"Banana/banana-combo-car-nade.mp4" },
      { name:"Coffins smoke",         tag:"SMOKE", group:"Banana",     file:"Banana/coffins-smoke.mp4" },
      { name:"CT smoke",              tag:"SMOKE", group:"Banana",     file:"Banana/CT-smoke.mp4" },
      { name:"New box molotov",       tag:"MOLLY", group:"Banana",     file:"Banana/new-box-molotov.mp4" },
      { name:"Banana retake flash",   tag:"FLASH", group:"Ramp",       file:"Ramp/Banana-retake-flash.mp4" },
      { name:"Nade combo",            tag:"NADE",  group:"Second mid", file:"Second-mid/Nade-combo.mp4" },
    ],
    ct: [
      { name:"Lurk smoke",            tag:"SMOKE", group:"A site \u00b7 Apps",   file:"A-site/Apps/Lurk-smoke.mp4" },
      { name:"Balcony molotov",       tag:"MOLLY", group:"A site \u00b7 Boiler", file:"A-site/Boiler/Balcony-molotov.mp4" },
      { name:"A site retake combo",   tag:"NADE",  group:"A site \u00b7 Long",   file:"A-site/long/A-site-retake-combo.mp4" },
      { name:"Apps balcony molotov",  tag:"MOLLY", group:"A site \u00b7 Long",   file:"A-site/long/Apps-balcony-molotov.mp4" },
      { name:"Delay molotov nade",    tag:"MOLLY", group:"A site \u00b7 Short",  file:"A-site/Short/Delay-molotov-nade.mp4" },
      { name:"Banana retake smoke",   tag:"SMOKE", group:"B site",          file:"B-site/banana-retake-smoke.mp4" },
      { name:"Coffins popflash",      tag:"FLASH", group:"B site",          file:"B-site/coffins-popflash.mp4" },
      { name:"New box retake molly",  tag:"MOLLY", group:"B site",          file:"B-site/new-box-retake-molly.mp4" },
      { name:"Retake nades",          tag:"NADE",  group:"B site",          file:"B-site/retake-nades-ct.mp4" },
      { name:"Banana molotov 1",      tag:"MOLLY", group:"B site \u00b7 Banana", file:"B-site/Banana/banana-molotov-1.mp4" },
      { name:"Banana molotov 2",      tag:"MOLLY", group:"B site \u00b7 Banana", file:"B-site/Banana/banana-molotov-2.mp4" },
      { name:"Car flash 1",           tag:"FLASH", group:"B site \u00b7 Banana", file:"B-site/Banana/car-flash-1.mp4" },
      { name:"Car flash 2",           tag:"FLASH", group:"B site \u00b7 Banana", file:"B-site/Banana/car-flash-2.mp4" },
      { name:"Mailbox nade",          tag:"NADE",  group:"B site \u00b7 Banana", file:"B-site/Banana/mailbox-nade.mp4" },
      { name:"Retake molly nade",     tag:"MOLLY", group:"B site \u00b7 Church", file:"B-site/Church/Retake-molly-nade.mp4" },
      { name:"Half wall",             tag:"NADE",  group:"CT spawn",        file:"CT-spawn/Half-wall.mp4" },
      { name:"Mid faze",              tag:"NADE",  group:"CT spawn",        file:"CT-spawn/Mid-faze.mp4" },
    ],
  },
  "Nuke":    { t: [], ct: [] },
  "Ancient": { t: [], ct: [] },
  "Anubis":  { t: [], ct: [] },
  "Dust II": { t: [], ct: [] },
  "Overpass": { t: [], ct: [] },
};

/* Cover images for the map list. Path is relative to the repo root.
   GitHub URLs are case-sensitive, so this must match your real folder + file
   names EXACTLY (capitals included). Leave a map out and it shows the plain row. */
const COVERS = {
  "Mirage":   "videos/Mirage/cover.webp",
  "Inferno":  "videos/inferno/cover.webp",
  "Nuke":     "videos/Nuke/cover.jpeg",
  "Ancient":  "videos/Ancient/cover.jpg",
  "Anubis":   "videos/Anubis/cover.webp",
  "Dust II":  "videos/Dust II/cover.jpg",
  "Overpass": "videos/Overpass/cover.webp",
};

/* ════════════ end of editable section ════════════ */

const $ = id => document.getElementById(id);
const screens = ["maps","side","clips","player"];
const state = { screen:"maps", map:null, side:null, clip:null };

const slug = s => s.toLowerCase().replace(/\s+/g,"");
const videoPath = (map, side, file) => `videos/${slug(map)}/${side}/${file}`;
const sideName = s => s === "t" ? "Terrorist" : "Counter-Terrorist";

function go(screen){
  state.screen = screen;
  screens.forEach(s => $("screen-"+s).classList.toggle("active", s===screen));
  document.body.classList.toggle("can-go-back", screen !== "maps");
  document.body.dataset.side = (screen==="maps"||screen==="side") ? "" : state.side;
  render();
  window.scrollTo(0,0);
}

function render(){
  if(state.screen==="maps"){
    $("crumb").textContent = "UTIL BOOK";
    $("title").textContent = "Maps";
    $("screen-maps").innerHTML = MAPS.map(m=>{
      const c = CLIPS[m] || {t:[],ct:[]};
      const n = (c.t?.length||0)+(c.ct?.length||0);
      return `<button class="map-row" data-map="${m}">
        <span class="cover"></span>
        <span class="map-glyph">${m[0]}</span>
        <span class="map-name">${m}</span>
        <span class="map-count">${n} clip${n===1?"":"s"}</span>
      </button>`;
    }).join("");
    // load each map's cover from the COVERS map; apply only if it actually loads
    document.querySelectorAll("#screen-maps .map-row").forEach(row=>{
      const map = row.dataset.map;
      const url = COVERS[map];
      if(!url) return;
      const img = new Image();
      img.onload = ()=>{
        row.querySelector(".cover").style.backgroundImage = `url("${encodeURI(url)}")`;
        row.classList.add("has-cover");
      };
      img.src = encodeURI(url);
    });
  }
  if(state.screen==="side"){
    $("crumb").textContent = "PICK A SIDE";
    $("title").textContent = state.map;
  }
  if(state.screen==="clips"){
    $("crumb").textContent = state.map.toUpperCase();
    $("title").textContent = sideName(state.side);
    const list = (CLIPS[state.map]?.[state.side]) || [];
    if(!list.length){
      $("screen-clips").innerHTML = `<div class="empty">No clips here yet.<br><br>
        Drop a trimmed clip into<br><code>videos/${slug(state.map)}/${state.side}/</code><br>
        and add it to the CLIPS list at the top of this file.</div>`;
    } else {
      const groups = [...new Set(list.map(c=>c.group||"Clips"))];
      $("screen-clips").innerHTML = groups.map((g,i)=>{
        const items = list.filter(c=>(c.group||"Clips")===g);
        const rows = items.map(c=>`
          <button class="clip-row" data-file="${c.file}">
            <span class="tag">${c.tag||"UTIL"}</span>
            <span class="clip-name">${c.name}</span>
            <span class="chev">&#8250;</span>
          </button>`).join("");
        return `<div class="group" data-group="${i}">
          <button class="group-head" data-group="${i}">
            <span class="group-title">${g}</span>
            <span class="group-meta">${items.length}</span>
            <span class="group-arrow">&#9656;</span>
          </button>
          <div class="group-body"><div>${rows}</div></div>
        </div>`;
      }).join("");
    }
  }
  if(state.screen==="player" && state.clip){
    $("crumb").textContent = `${state.map.toUpperCase()} &middot; ${state.side.toUpperCase()}`.replace("&middot;","·");
    $("title").textContent = state.clip.name;
    $("pTag").textContent = state.clip.tag || "UTIL";
    $("pTitle").textContent = state.clip.name;
    const v = $("vid");
    $("vidError").style.display = "none";
    v.src = videoPath(state.map, state.side, state.clip.file);
    v.play().catch(()=>{ /* autoplay may be blocked until user taps — fine */ });
  } else {
    const v = $("vid"); v.pause(); v.removeAttribute("src"); v.load();
  }
}

function enterFullscreen(v){
  try{
    if (v.requestFullscreen){
      v.requestFullscreen().then(()=>{
        // try to rotate to landscape on Android; harmless if unsupported
        screen.orientation?.lock?.("landscape").catch(()=>{});
      }).catch(()=>{});
    } else if (v.webkitEnterFullscreen){
      // iPhone Safari: native fullscreen video player
      if (v.readyState >= 1) v.webkitEnterFullscreen();
      else v.addEventListener("loadedmetadata", ()=>{ try{ v.webkitEnterFullscreen(); }catch(_){} }, { once:true });
    }
  }catch(_){}
}

document.addEventListener("click", e=>{
  const mapBtn = e.target.closest(".map-row");
  if(mapBtn){ state.map = mapBtn.dataset.map; go("side"); return; }
  const sideBtn = e.target.closest(".side-card");
  if(sideBtn){ state.side = sideBtn.dataset.side; go("clips"); return; }
  const groupHead = e.target.closest(".group-head");
  if(groupHead){ groupHead.closest(".group").classList.toggle("open"); return; }
  const clipBtn = e.target.closest(".clip-row");
  if(clipBtn){
    state.clip = (CLIPS[state.map][state.side]).find(c=>c.file===clipBtn.dataset.file);
    go("player");
    enterFullscreen($("vid"));
    return;
  }
});

$("backBtn").addEventListener("click", ()=>{
  const order = {player:"clips", clips:"side", side:"maps"};
  if(order[state.screen]) go(order[state.screen]);
});

$("replayBtn").addEventListener("click", ()=>{
  const v=$("vid"); v.currentTime=0; v.play();
});

$("vid").addEventListener("error", ()=>{
  if(!state.clip) return;
  const err=$("vidError");
  err.innerHTML = `Video not found. Expected file at:<br><code>${videoPath(state.map,state.side,state.clip.file)}</code>`;
  err.style.display="block";
});

document.addEventListener("fullscreenchange", ()=>{
  if(!document.fullscreenElement){
    try{ screen.orientation?.unlock?.(); }catch(_){}
  }
});

render();
</script>
</body>
</html>
