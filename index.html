<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Util Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141b;
    --bg-raise:#171c26;
    --bg-press:#1e2533;
    --line:#262e3e;
    --text:#e8ecf3;
    --text-dim:#8b94a6;
    --t-accent:#ddb243;
    --ct-accent:#6e9ecf;
    --accent:#9aa4b5;
    --danger:#d4604f;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overscroll-behavior-y:none;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  body[data-side="t"]{--accent:var(--t-accent)}
  body[data-side="ct"]{--accent:var(--ct-accent)}

  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 10px;
    background:linear-gradient(var(--bg) 75%, transparent);
  }
  .back{
    flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:11px;
    background:var(--bg-raise);color:var(--text);font-size:18px;line-height:1;
    display:none;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s;
  }
  .back:active{background:var(--bg-press)}
  body.can-go-back .back{display:flex}
  .crumbs{min-width:0}
  .crumbs .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);
  }
  .crumbs h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;
    letter-spacing:.02em;text-transform:uppercase;line-height:1.05;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  main{flex:1;padding:6px 16px 32px}

  /* ---------- screens & transitions ---------- */
  .screen{display:none;animation:slide .22s ease both}
  .screen.active{display:block}
  @keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}

  /* ---------- map list ---------- */
  .map-row{
    position:relative;overflow:hidden;
    width:100%;display:flex;align-items:center;gap:14px;
    background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 18px;margin-bottom:10px;cursor:pointer;color:var(--text);
    text-align:left;transition:background .15s,border-color .15s,transform .12s;
    min-height:84px;
  }
  .map-row .cover{
    position:absolute;inset:0;z-index:0;
    background-size:cover;background-position:center;
    opacity:0;transition:opacity .3s;
  }
  .map-row.has-cover .cover{opacity:1}
  .map-row.has-cover::after{
    content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg, rgba(16,20,27,.92) 0%, rgba(16,20,27,.72) 45%, rgba(16,20,27,.45) 100%);
  }
  .map-row > *{position:relative;z-index:2}
  .map-row:active{transform:scale(.99)}
  .map-glyph{
    flex:none;width:46px;height:46px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;
    background:rgba(30,37,51,.7);color:var(--text);border:1px solid var(--line);
    backdrop-filter:blur(2px);
  }
  .map-row.has-cover .map-glyph{display:none}
  .map-name{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:25px;
    letter-spacing:.04em;text-transform:uppercase;
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
  .map-count{
    margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
    text-shadow:0 1px 6px rgba(0,0,0,.7);
  }

  /* ---------- side picker ---------- */
  .sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .side-card{
    border-radius:var(--radius);border:1px solid var(--line);background:var(--bg-raise);
    padding:30px 14px 24px;cursor:pointer;color:var(--text);text-align:center;
    transition:transform .12s,border-color .15s;
  }
  .side-card:active{transform:scale(.97)}
  .side-card .badge{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1;
  }
  .side-card.t .badge{color:var(--t-accent)}
  .side-card.ct .badge{color:var(--ct-accent)}
  .side-card .label{margin-top:8px;font-size:13px;color:var(--text-dim)}
  .side-card.t:active{border-color:var(--t-accent)}
  .side-card.ct:active{border-color:var(--ct-accent)}

  /* ---------- filter chips ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px}
  .chip{
    flex:none;padding:9px 16px;border-radius:20px;cursor:pointer;
    background:var(--bg-raise);border:1px solid var(--line);color:var(--text-dim);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
    transition:background .15s,border-color .15s,color .15s;
  }
  .chip:active{background:var(--bg-press)}
  .chip.on{
    background:var(--accent);border-color:var(--accent);color:#0c0f15;font-weight:600;
  }

  /* ---------- search (legacy, kept for safety) ---------- */
  .search-wrap{position:relative;display:flex;align-items:center;margin:2px 0 16px}
  .search-icon{position:absolute;left:14px;color:var(--text-dim);font-size:15px;pointer-events:none}
  .search-input{
    width:100%;padding:14px 40px 14px 40px;
    background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--radius);
    color:var(--text);font-family:'Inter',sans-serif;font-size:15px;outline:none;
    transition:border-color .15s;
  }
  .search-input::placeholder{color:var(--text-dim)}
  .search-input:focus{border-color:var(--accent)}
  .search-clear{
    position:absolute;right:8px;width:30px;height:30px;display:none;
    align-items:center;justify-content:center;border:0;border-radius:8px;
    background:var(--bg-press);color:var(--text-dim);font-size:18px;cursor:pointer;
  }
  .search-clear:active{background:var(--line)}

  /* ---------- clip list (collapsible groups) ---------- */
  .group{
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--bg-raise);margin-bottom:10px;overflow:hidden;
  }
  .group-head{
    width:100%;display:flex;align-items:center;gap:12px;
    padding:16px;background:transparent;border:0;color:var(--text);cursor:pointer;
    text-align:left;transition:background .15s;
  }
  .group-head:active{background:var(--bg-press)}
  .group-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
    letter-spacing:.05em;text-transform:uppercase;
  }
  .group-meta{
    margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--text-dim);background:var(--bg-press);border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;
  }
  .group-arrow{flex:none;color:var(--accent);font-size:13px;transition:transform .2s;transform:rotate(0deg)}
  .group.open .group-arrow{transform:rotate(90deg)}
  .group-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
  .group.open .group-body{grid-template-rows:1fr}
  .group-body > *{overflow:hidden;min-height:0}
  @media (prefers-reduced-motion:reduce){.group-body{transition:none}}
  .clip-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-press);border:1px solid var(--line);border-radius:11px;
    padding:13px;margin:0 10px 8px;cursor:pointer;color:var(--text);text-align:left;
    transition:filter .15s;
  }
  .clip-row:first-child{margin-top:2px}
  .clip-row:active{filter:brightness(1.25)}
  .tag{
    flex:none;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
    letter-spacing:.12em;padding:5px 8px;border-radius:6px;
    border:1px solid var(--accent);color:var(--accent);min-width:58px;text-align:center;
  }
  .clip-name{font-size:15px;font-weight:500;line-height:1.3}
  .chev{margin-left:auto;color:var(--text-dim);font-size:16px}
  .empty{
    margin-top:36px;text-align:center;color:var(--text-dim);font-size:14px;line-height:1.6;padding:0 12px;
  }
  .empty code{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);
    background:var(--bg-raise);padding:2px 6px;border-radius:6px;
  }

  /* ════════ custom fullscreen swipe player ════════ */
  .player{
    position:fixed;inset:0;z-index:100;background:#000;
    display:none;flex-direction:column;
    touch-action:none;overscroll-behavior:none;
  }
  .player.show{display:flex}
  /* the vertical track holds prev / current / next stacked; we translateY it */
  .player-stage{position:absolute;inset:0;overflow:hidden}
  .pslide{
    position:absolute;left:0;right:0;height:100%;
    display:flex;align-items:center;justify-content:center;background:#000;
  }
  .pslide video{width:100%;height:100%;object-fit:contain;background:#000}
  .pslide .pv-loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;
  }
  .pslide.ready .pv-loading{opacity:0;pointer-events:none;transition:opacity .2s}
  .spinner{
    width:36px;height:36px;border-radius:50%;
    border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .pslide .pv-error{
    position:absolute;left:24px;right:24px;text-align:center;color:var(--danger);
    font-size:13px;line-height:1.6;display:none;
  }
  .pslide .pv-error code{font-family:'JetBrains Mono',monospace;font-size:12px;word-break:break-all}

  /* top overlay bar: name + tag + section */
  .player-top{
    position:absolute;top:0;left:0;right:0;z-index:5;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 26px;
    background:linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,0));
    pointer-events:none;
  }
  .player-top .ptag{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;
    color:var(--accent);text-transform:uppercase;
  }
  .player-top .pname{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;
    letter-spacing:.02em;text-transform:uppercase;line-height:1.1;margin-top:2px;
    text-shadow:0 2px 10px rgba(0,0,0,.8);
  }
  .player-top .psection{
    font-size:12px;color:var(--text-dim);margin-top:3px;
  }

  /* bottom hint bar */
  .player-bottom{
    position:absolute;bottom:0;left:0;right:0;z-index:5;
    padding:24px 18px calc(env(safe-area-inset-bottom) + 16px);
    background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.7));
    display:flex;align-items:center;justify-content:space-between;
    pointer-events:none;
  }
  .player-bottom .phint{
    font-size:11px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:6px;
  }
  .player-pos{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.55);
  }

  /* section transition card that flashes when crossing into a new group */
  .section-card{
    position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:rgba(8,10,14,.96);
    opacity:0;pointer-events:none;
  }
  .section-card.flash{animation:sectionFlash 0.9s ease both}
  @keyframes sectionFlash{
    0%{opacity:0;transform:scale(1.04)}
    18%{opacity:1;transform:scale(1)}
    72%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(.99)}
  }
  .section-card .sc-eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;
    color:var(--accent);text-transform:uppercase;margin-bottom:10px;
  }
  .section-card .sc-name{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--text);text-align:center;
    padding:0 24px;line-height:1.05;
  }
  .section-card .sc-arrow{margin-top:14px;color:var(--text-dim);font-size:20px}

  /* tap-to-toggle play feedback */
  .tap-icon{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
    z-index:6;width:76px;height:76px;border-radius:50%;
    background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:30px;opacity:0;pointer-events:none;
  }
  .tap-icon.show{animation:tapPulse .5s ease both}
  @keyframes tapPulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}

  /* ════════ tutorial overlay ════════ */
  .tut{
    position:fixed;inset:0;z-index:200;display:none;
    align-items:flex-end;justify-content:center;
    background:rgba(6,8,12,.6);backdrop-filter:blur(3px);
  }
  .tut.show{display:flex;animation:tutFade .25s ease both}
  @keyframes tutFade{from{opacity:0}to{opacity:1}}
  .tut-sheet{
    width:100%;max-width:560px;background:var(--bg-raise);
    border-top-left-radius:22px;border-top-right-radius:22px;
    border:1px solid var(--line);border-bottom:0;
    padding:14px 22px calc(env(safe-area-inset-bottom) + 22px);
    box-shadow:0 -20px 60px rgba(0,0,0,.5);
  }
  .tut-grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
  .tut-skip{
    position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;
    background:rgba(20,25,35,.85);border:1px solid var(--line);color:var(--text-dim);
    font-size:13px;padding:9px 16px;border-radius:20px;cursor:pointer;
  }
  .tut-skip:active{background:var(--bg-press)}
  .tut-stage{height:188px;position:relative;border-radius:var(--radius);
    background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-bottom:18px}
  .tut-slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
  .tut-slide.active{display:flex}

  /* swipe-left demo */
  .demo-phone{
    width:96px;height:130px;border-radius:14px;border:2px solid var(--line);
    background:var(--bg-press);position:relative;overflow:hidden;
  }
  .demo-card{
    position:absolute;inset:8px;border-radius:9px;background:var(--bg-raise);
    border:1px solid var(--line);
  }
  .demo-hand{
    position:absolute;font-size:30px;top:50%;transform:translateY(-50%);
  }
  .demo-hand.left{animation:handRight 1.8s ease-in-out infinite}
  @keyframes handRight{0%{left:8%;opacity:0}15%{opacity:1}70%{left:62%;opacity:1}100%{left:62%;opacity:0}}
  .demo-card.swipeleft{animation:cardRight 1.8s ease-in-out infinite}
  @keyframes cardRight{0%,15%{transform:translateX(0);opacity:1}70%{transform:translateX(70px);opacity:0}100%{transform:translateX(70px);opacity:0}}

  /* swipe-vertical demo */
  .demo-hand.vert{animation:handVert 1.9s ease-in-out infinite}
  @keyframes handVert{0%{top:18%;opacity:0}14%{opacity:1}68%{top:72%;opacity:1}100%{top:72%;opacity:0}}
  .demo-stack{position:absolute;inset:8px;display:flex;flex-direction:column;gap:6px}
  .demo-stack .ds{height:26px;border-radius:7px;background:var(--bg-raise);border:1px solid var(--line);flex:none}
  .demo-stack.scroll{animation:stackScroll 1.9s ease-in-out infinite}
  @keyframes stackScroll{0%,14%{transform:translateY(0)}68%,100%{transform:translateY(-38px)}}

  /* rotate-phone demo */
  .demo-rotate{display:flex;align-items:center;justify-content:center}
  .demo-phone-rot{
    width:78px;height:140px;border-radius:14px;border:2px solid var(--accent);
    background:var(--bg-press);display:flex;align-items:center;justify-content:center;
    transform-origin:center;animation:phoneFlip 2.2s ease-in-out infinite;
  }
  .demo-phone-rot .rot-screen{
    width:60%;height:78%;border-radius:6px;background:var(--bg-raise);border:1px solid var(--line);
  }
  @keyframes phoneFlip{
    0%,20%{transform:rotate(0deg)}
    55%,75%{transform:rotate(-90deg)}
    95%,100%{transform:rotate(-90deg)}
  }

  /* WEE / WOO on the karrigan slide */
  .weewoo-wrap{display:flex;align-items:center;justify-content:center;gap:14px}
  .karrigan-gif{max-height:150px;max-width:55%;border-radius:10px}
  .weewoo{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;
    letter-spacing:.08em;visibility:hidden;min-width:46px;text-align:center;
  }
  .weewoo.show{visibility:visible}
  .weewoo.red{color:#e3473a}
  .weewoo.white{color:#ffffff}

  .tut-text{text-align:center}
  .tut-text h3{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:25px;
    letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;
  }
  .tut-text p{font-size:14px;color:var(--text-dim);line-height:1.5;padding:0 6px}
  .tut-foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
  .tut-dots{display:flex;gap:7px}
  .tut-dots .d{width:8px;height:8px;border-radius:50%;background:rgba(221,178,67,.25);transition:background .2s,width .2s}
  .tut-dots .d.on{background:rgba(221,178,67,.7);width:20px;border-radius:5px}
  .tut-next{
    background:var(--accent);color:#0c0f15;border:0;border-radius:11px;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;
    letter-spacing:.06em;text-transform:uppercase;padding:12px 26px;cursor:pointer;
  }
  .tut-next:active{filter:brightness(.92)}

  button:focus-visible,.map-row:focus-visible,.clip-row:focus-visible,.side-card:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn" aria-label="Back">&#8592;</button>
    <div class="crumbs">
      <div class="eyebrow" id="crumb">UTIL BOOK</div>
      <h1 id="title">Maps</h1>
    </div>
  </header>
  <main>
    <section class="screen active" id="screen-maps"></section>
    <section class="screen" id="screen-side">
      <div class="sides">
        <button class="side-card t" data-side="t"><div class="badge">T</div><div class="label">Terrorist</div></button>
        <button class="side-card ct" data-side="ct"><div class="badge">CT</div><div class="label">Counter-Terrorist</div></button>
      </div>
    </section>
    <section class="screen" id="screen-clips"></section>
  </main>
</div>

<!-- custom fullscreen swipe player -->
<div class="player" id="player">
  <div class="player-stage" id="pstage">
    <div class="pslide" id="pslidePrev"></div>
    <div class="pslide" id="pslideCur"></div>
    <div class="pslide" id="pslideNext"></div>
  </div>
  <div class="tap-icon" id="tapIcon">&#10073;&#10073;</div>
  <div class="section-card" id="sectionCard">
    <div class="sc-eyebrow">Section</div>
    <div class="sc-name" id="scName"></div>
    <div class="sc-arrow" id="scArrow">&#9662;</div>
  </div>
  <div class="player-top" id="playerTop">
    <div class="ptag" id="pTag2"></div>
    <div class="pname" id="pName2"></div>
    <div class="psection" id="pSection2"></div>
  </div>
  <div class="player-bottom">
    <span class="phint">swipe right to exit &#8594;</span>
    <span class="player-pos" id="pPos"></span>
  </div>
</div>

<!-- first-launch tutorial -->
<div class="tut" id="tut">
  <button class="tut-skip" id="tutSkip">Skip</button>
  <div class="tut-sheet">
    <div class="tut-grip"></div>
    <div class="tut-stage" id="tutStage">
      <div class="tut-slide active" data-slide="0">
        <div class="demo-rotate">
          <div class="demo-phone-rot"><span class="rot-screen"></span></div>
        </div>
      </div>
      <div class="tut-slide" data-slide="1">
        <div class="demo-phone">
          <div class="demo-card swipeleft"></div>
          <div class="demo-hand left">&#128073;</div>
        </div>
      </div>
      <div class="tut-slide" data-slide="2">
        <div class="demo-phone">
          <div class="demo-stack scroll"><span class="ds"></span><span class="ds"></span><span class="ds"></span><span class="ds"></span><span class="ds"></span></div>
          <div class="demo-hand vert">&#128070;</div>
        </div>
      </div>
      <div class="tut-slide" data-slide="3">

const $ = id => document.getElementById(id);
const screensList = ["maps","side","clips"];
const state = { screen:"maps", map:null, side:null, filter:"", lastGroup:null,
                flat:[], idx:0 };

const slug = s => s.toLowerCase().replace(/\s+/g,"");
const videoPath = (map, side, file) =>
  `videos/${slug(map)}/${side}/` + file.split("/").map(encodeURIComponent).join("/");
const sideName = s => s === "t" ? "Terrorist" : "Counter-Terrorist";
const groupOf = c => c.group || "Clips";

/* remember scroll position of the clip list so we can restore it */
let clipScroll = 0;

function go(screen){
  state.screen = screen;
  screensList.forEach(s => $("screen-"+s).classList.toggle("active", s===screen));
  document.body.classList.toggle("can-go-back", screen !== "maps");
  document.body.dataset.side = (screen==="maps"||screen==="side") ? "" : state.side;
  render();
  window.scrollTo(0,0);
}

function renderClipList(list, filterKey){
  // filterKey is "" (All) or a type key like FLASH/NADE/MOLLY/SMOKE
  let filtered = list;
  if(filterKey){
    const def = FILTER_TYPES.find(f=>f.key===filterKey);
    const tags = def ? def.tags : [filterKey];
    filtered = list.filter(c => tags.includes((c.tag||"").toUpperCase()));
  }
  const target = $("clipResults");
  if(!target) return;

  if(!filtered.length){
    const label = (FILTER_TYPES.find(f=>f.key===filterKey)||{}).label || "that type";
    target.innerHTML = `<div class="empty">No ${label.toLowerCase()} lineups on this side yet.</div>`;
    return;
  }
  const filtering = !!filterKey;
  const groups = [...new Set(filtered.map(groupOf))];
  target.innerHTML = groups.map((g,i)=>{
    const items = filtered.filter(c=>groupOf(c)===g);
    const rows = items.map(c=>`
      <button class="clip-row" data-file="${c.file}">
        <span class="tag">${c.tag||"UTIL"}</span>
        <span class="clip-name">${c.name}</span>
        <span class="chev">&#8250;</span>
      </button>`).join("");
    // when a filter is active, open every group so results are visible
    const isOpen = filtering ? true : (state.lastGroup && g === state.lastGroup);
    const openClass = isOpen ? " open" : "";
    return `<div class="group${openClass}" data-group="${i}">
      <button class="group-head" data-group="${i}">
        <span class="group-title">${g}</span>
        <span class="group-meta">${items.length}</span>
        <span class="group-arrow">&#9656;</span>
      </button>
      <div class="group-body"><div>${rows}</div></div>
    </div>`;
  }).join("");

  // restore scroll to the open group when returning from a clip (only when not filtering)
  if(!filtering && state.lastGroup){
    const open = target.querySelector(".group.open");
    if(open){
      requestAnimationFrame(()=>{
        if(clipScroll){ window.scrollTo(0, clipScroll); }
        else { open.scrollIntoView({block:"center"}); }
      });
    }
  }
}

function render(){
  if(state.screen==="maps"){
    $("crumb").textContent = "UTIL BOOK";
    $("title").textContent = "Maps";
    $("screen-maps").innerHTML = MAPS.map(m=>{
      const c = CLIPS[m] || {t:[],ct:[]};
      const n = (c.t?.length||0)+(c.ct?.length||0);
      return `<button class="map-row" data-map="${m}">
        <span class="cover"></span>
        <span class="map-glyph">${m[0]}</span>
        <span class="map-name">${m}</span>
        <span class="map-count">${n} clip${n===1?"":"s"}</span>
      </button>`;
    }).join("");
    document.querySelectorAll("#screen-maps .map-row").forEach(row=>{
      const map = row.dataset.map;
      const url = COVERS[map];
      if(!url) return;
      const img = new Image();
      img.onload = ()=>{
        row.querySelector(".cover").style.backgroundImage = `url("${encodeURI(url)}")`;
        row.classList.add("has-cover");
      };
      img.src = encodeURI(url);
    });
  }
  if(state.screen==="side"){
    $("crumb").textContent = "PICK A SIDE";
    $("title").textContent = state.map;
  }
  if(state.screen==="clips"){
    $("crumb").textContent = state.map.toUpperCase();
    $("title").textContent = sideName(state.side);
    const list = (CLIPS[state.map]?.[state.side]) || [];
    if(!list.length){
      $("screen-clips").innerHTML = `<div class="empty">No clips here yet.<br><br>
        Drop a trimmed clip into<br><code>videos/${slug(state.map)}/${state.side}/</code><br>
        and add it to the CLIPS list at the top of this file.</div>`;
    } else {
      const chips = FILTER_TYPES.map(f=>
        `<button class="chip${state.filter===f.key?" on":""}" data-filter="${f.key}">${f.label}</button>`
      ).join("");
      $("screen-clips").innerHTML = `
        <div class="chips">
          <button class="chip${!state.filter?" on":""}" data-filter="">All</button>
          ${chips}
        </div>
        <div id="clipResults"></div>`;
      renderClipList(list, state.filter);
    }
  }
}

/* the filter chips and which tag values they match */
const FILTER_TYPES = [
  { key:"FLASH", label:"Flash",   tags:["FLASH"] },
  { key:"NADE",  label:"Nade",    tags:["NADE","HE"] },
  { key:"MOLLY", label:"Molotov", tags:["MOLLY","INCENDIARY","FIRE"] },
  { key:"SMOKE", label:"Smoke",   tags:["SMOKE"] },
];

/* ---------- list navigation ---------- */
document.addEventListener("click", e=>{
  const mapBtn = e.target.closest(".map-row");
  if(mapBtn){ state.map = mapBtn.dataset.map; go("side"); return; }
  const sideBtn = e.target.closest(".side-card");
  if(sideBtn){ state.side = sideBtn.dataset.side; state.lastGroup = null; state.filter = ""; clipScroll = 0; go("clips"); return; }
  const chip = e.target.closest(".chip");
  if(chip){
    state.filter = chip.dataset.filter || "";
    clipScroll = 0; state.lastGroup = null;
    const list = (CLIPS[state.map]?.[state.side]) || [];
    // update chip highlight without a full re-render
    document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", (c.dataset.filter||"")===state.filter));
    renderClipList(list, state.filter);
    return;
  }
  const groupHead = e.target.closest(".group-head");
  if(groupHead){ groupHead.closest(".group").classList.toggle("open"); return; }
  const clipBtn = e.target.closest(".clip-row");
  if(clipBtn){
    clipScroll = window.scrollY;
    openPlayer(clipBtn.dataset.file);
    return;
  }
});

function goBack(){
  const order = {clips:"side", side:"maps"};
  if(order[state.screen]) go(order[state.screen]);
}

$("backBtn").addEventListener("click", goBack);

/* swipe right anywhere in the menus to step back one screen */
let mStartX=0, mStartY=0, mTracking=false, mAxis=null, mDX=0, mDY=0;
const appEl = document.getElementById("app");
appEl.addEventListener("touchstart", e=>{
  // don't hijack horizontal swipes that start on the filter chips
  if(e.target.closest(".chips")) { mTracking=false; return; }
  const t=e.touches[0];
  mStartX=t.clientX; mStartY=t.clientY; mDX=0; mDY=0; mTracking=true; mAxis=null;
}, {passive:true});
appEl.addEventListener("touchmove", e=>{
  if(!mTracking) return;
  const t=e.touches[0];
  mDX=t.clientX-mStartX; mDY=t.clientY-mStartY;
  if(!mAxis && (Math.abs(mDX)>10 || Math.abs(mDY)>10)){
    mAxis = Math.abs(mDX)>Math.abs(mDY) ? "x" : "y";
  }
}, {passive:true});
appEl.addEventListener("touchend", ()=>{
  if(!mTracking) return;
  mTracking=false;
  // right swipe (positive X), mostly horizontal, past threshold → go back
  if(mAxis==="x" && mDX > 70){ goBack(); }
  mAxis=null;
});

/* ════════════ custom swipe player ════════════ */

function buildFlatList(){
  // the full ordered list for the current map+side, in display (grouped) order
  const list = (CLIPS[state.map]?.[state.side]) || [];
  const groups = [...new Set(list.map(groupOf))];
  const flat = [];
  groups.forEach(g=>{
    list.filter(c=>groupOf(c)===g).forEach(c=> flat.push(c));
  });
  return flat;
}

function openPlayer(file){
  state.flat = buildFlatList();
  state.idx = Math.max(0, state.flat.findIndex(c=>c.file===file));
  state.lastGroup = state.flat[state.idx] ? groupOf(state.flat[state.idx]) : null;
  $("player").classList.add("show");
  loadSlides(true);
}

function closePlayer(){
  // pause/clear all slide videos
  ["pslidePrev","pslideCur","pslideNext"].forEach(id=>{
    const v = $(id).querySelector("video");
    if(v){ v.pause(); v.removeAttribute("src"); v.load(); }
  });
  $("player").classList.remove("show");
  // restore the list at the same scroll position with the right group open
  render();
}

function slideMarkup(clip){
  if(!clip) return "";
  return `<video playsinline loop muted autoplay preload="auto"></video>
          <div class="pv-loading"><span class="spinner"></span></div>
          <div class="pv-error"></div>`;
}

let userPaused = false;  // set true only when the user taps to pause

function fillSlide(slideEl, clip, autoplay){
  slideEl.classList.remove("ready");
  if(!clip){ slideEl.innerHTML = ""; return; }
  slideEl.innerHTML = slideMarkup(clip);
  const v = slideEl.querySelector("video");
  const errBox = slideEl.querySelector(".pv-error");
  v.muted = true;            // required for mobile autoplay
  v.playsInline = true;
  v.preload = "auto";
  v.src = videoPath(state.map, state.side, clip.file);
  v.load();

  const markReady = ()=> slideEl.classList.add("ready");
  v.addEventListener("loadeddata", markReady, {once:true});
  v.addEventListener("playing", markReady, {once:true});

  if(autoplay){
    userPaused = false;
    const kick = ()=>{ if(userPaused) return; const p=v.play(); if(p&&p.catch) p.catch(()=>{}); };
    // fire on every load milestone (NOT once-only, so late events still kick it)
    ["loadedmetadata","loadeddata","canplay","canplaythrough","stalled","waiting"].forEach(ev=>
      v.addEventListener(ev, kick)
    );
    // persistent watcher: if it pauses while it should be playing, resume
    v.addEventListener("pause", ()=>{ if(!userPaused) setTimeout(kick, 30); });
    kick();
    setTimeout(kick, 80);
    setTimeout(kick, 220);
    setTimeout(kick, 500);
  }
  // neighbours: preload="auto" buffers them in the background

  v.addEventListener("error", ()=>{
    slideEl.classList.add("ready");
    errBox.innerHTML = `Video not found:<br><code>${videoPath(state.map,state.side,clip.file)}</code>`;
    errBox.style.display = "block";
  }, {once:true});
}

// position the three slides vertically: prev above, cur center, next below
function positionSlides(offset){
  const h = window.innerHeight;
  $("pslidePrev").style.transform = `translateY(${-h + (offset||0)}px)`;
  $("pslideCur").style.transform  = `translateY(${(offset||0)}px)`;
  $("pslideNext").style.transform = `translateY(${h + (offset||0)}px)`;
}

function loadSlides(autoplayCur){
  const cur  = state.flat[state.idx];
  const prev = state.flat[state.idx-1];
  const next = state.flat[state.idx+1];
  // pause any existing videos first
  ["pslidePrev","pslideCur","pslideNext"].forEach(id=>{
    const vid=$(id).querySelector("video"); if(vid) vid.pause();
  });
  fillSlide($("pslideCur"), cur, autoplayCur !== false);
  fillSlide($("pslidePrev"), prev, false);
  fillSlide($("pslideNext"), next, false);
  positionSlides(0);
  updatePlayerChrome();
}

function updatePlayerChrome(){
  const cur = state.flat[state.idx];
  if(!cur) return;
  $("pTag2").textContent = cur.tag || "UTIL";
  $("pName2").textContent = cur.name;
  $("pSection2").textContent = groupOf(cur);
  $("pPos").textContent = `${state.idx+1} / ${state.flat.length}`;
  state.lastGroup = groupOf(cur);
}

// animate to a neighbouring clip; dir = +1 (next/down-swipe) or -1 (prev/up-swipe)
let animating = false;
function navigate(dir){
  const target = state.idx + dir;
  if(target < 0 || target >= state.flat.length){
    // bounce back
    positionSlides(0);
    return;
  }
  if(animating) return;
  animating = true;

  const h = window.innerHeight;
  const fromGroup = groupOf(state.flat[state.idx]);
  const toGroup   = groupOf(state.flat[target]);

  const stage = $("pstage");
  stage.style.transition = "transform .26s ease";
  // moving to next (dir +1) slides everything up by h; to prev slides down by h
  stage.style.transform = `translateY(${dir>0 ? -h : h}px)`;

  setTimeout(()=>{
    stage.style.transition = "none";
    stage.style.transform = "translateY(0)";
    state.idx = target;
    loadSlides(true);
    animating = false;
    // section transition card if we crossed a group boundary
    if(fromGroup !== toGroup){
      flashSection(toGroup, dir>0 ? "down" : "up");
    }
  }, 270);
}

function flashSection(name, dir){
  $("scName").textContent = name;
  $("scArrow").innerHTML = dir === "down" ? "&#9662;" : "&#9652;";
  const card = $("sectionCard");
  card.classList.remove("flash");
  void card.offsetWidth; // restart animation
  card.classList.add("flash");
}

/* ---- touch handling on the player ---- */
let tStartX=0, tStartY=0, tDX=0, tDY=0, tracking=false, axis=null;

$("player").addEventListener("touchstart", e=>{
  if(animating) return;
  const t = e.touches[0];
  tStartX = t.clientX; tStartY = t.clientY;
  tDX = 0; tDY = 0; tracking = true; axis = null;
}, {passive:true});

$("player").addEventListener("touchmove", e=>{
  if(!tracking) return;
  const t = e.touches[0];
  tDX = t.clientX - tStartX;
  tDY = t.clientY - tStartY;
  if(!axis){
    if(Math.abs(tDX) > 10 || Math.abs(tDY) > 10){
      axis = Math.abs(tDX) > Math.abs(tDY) ? "x" : "y";
    }
  }
  if(axis === "y"){
    e.preventDefault();
    // follow finger with mild resistance at the ends
    let off = tDY;
    const atTop = state.idx === 0 && tDY > 0;
    const atEnd = state.idx === state.flat.length-1 && tDY < 0;
    if(atTop || atEnd) off = tDY * 0.3;
    positionSlides(off);
  } else if(axis === "x"){
    e.preventDefault();
  }
}, {passive:false});

$("player").addEventListener("touchend", ()=>{
  if(!tracking) return;
  tracking = false;
  const swipeThresh = 60;
  if(axis === "x" && tDX > swipeThresh){
    // swipe right → exit
    closePlayer();
    return;
  }
  if(axis === "y"){
    if(tDY < -swipeThresh){ navigate(+1); }        // swipe up → next
    else if(tDY > swipeThresh){ navigate(-1); }    // swipe down → prev
    else { positionSlides(0); }                    // not far enough → snap back
  } else {
    positionSlides(0);
  }
  axis = null;
});

/* tap center to play/pause */
$("pstage").addEventListener("click", e=>{
  // ignore if this was the tail end of a swipe
  if(Math.abs(tDX) > 8 || Math.abs(tDY) > 8) return;
  const v = $("pslideCur").querySelector("video");
  if(!v) return;
  if(v.paused){ userPaused = false; v.play().catch(()=>{}); showTap("&#9654;"); }
  else { userPaused = true; v.pause(); showTap("&#10073;&#10073;"); }
});
function showTap(glyph){
  const el = $("tapIcon");
  el.innerHTML = glyph;
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}

/* keyboard support (desktop testing) */
document.addEventListener("keydown", e=>{
  if(!$("player").classList.contains("show")) return;
  if(e.key === "ArrowDown"){ navigate(+1); }
  else if(e.key === "ArrowUp"){ navigate(-1); }
  else if(e.key === "ArrowRight" || e.key === "Escape"){ closePlayer(); }
});

window.addEventListener("resize", ()=>{
  if($("player").classList.contains("show")) positionSlides(0);
});

/* ════════════ tutorial (once per session) ════════════ */
const TUT_SLIDES = [
  { h:"Turn your phone sideways", p:"The Util Book works best in landscape — flip your phone for the clearest view of each lineup." },
  { h:"Swipe right to exit", p:"When you're watching a lineup, swipe right to jump back to the list." },
  { h:"Swipe up & down", p:"Flick up for the next lineup, down for the previous — it flows from one section into the next." },
  { h:"Enjoy the Util Book", p:"That's it. Pick a map, pick a side, and go find your nades." },
];
let tutIndex = 0;
let weewooTimer = null;

function showTutorial(){
  tutIndex = 0;
  renderTut();
  $("tut").classList.add("show");
  document.body.style.overflow = "hidden";   // lock vertical scroll behind the tutorial
}
function renderTut(){
  $("tutText").innerHTML = `<h3>${TUT_SLIDES[tutIndex].h}</h3><p>${TUT_SLIDES[tutIndex].p}</p>`;
  document.querySelectorAll(".tut-slide").forEach(s=>{
    s.classList.toggle("active", +s.dataset.slide === tutIndex);
  });
  $("tutDots").innerHTML = TUT_SLIDES.map((_,i)=>`<span class="d${i===tutIndex?" on":""}"></span>`).join("");
  $("tutNext").textContent = tutIndex === TUT_SLIDES.length-1 ? "Start" : "Next";
  // run WEE/WOO only on the last (GIF) slide
  if(tutIndex === TUT_SLIDES.length-1){ startWeeWoo(); } else { stopWeeWoo(); }
}
function nextTut(){
  if(tutIndex < TUT_SLIDES.length-1){ tutIndex++; renderTut(); }
  else { closeTutorial(); }
}
function prevTut(){
  if(tutIndex > 0){ tutIndex--; renderTut(); }
}
function closeTutorial(){
  stopWeeWoo();
  $("tut").classList.remove("show");
  document.body.style.overflow = "";
  try{ sessionStorage.setItem("ub_tut_seen","1"); }catch(_){}
}

/* WEE / WOO: one visible at a time, swap every 0.3s, toggle white<->red each time */
function startWeeWoo(){
  stopWeeWoo();
  // play the karrigan wee-woo sound once
  const a = $("weewooAudio");
  if(a){
    try{
      a.currentTime = 0;
      a.muted = false;
      a.volume = 1;
      const p = a.play();
      if(p && p.catch) p.catch(()=>{
        // if the browser blocks it, play on the next tap anywhere in the tutorial
        const once = ()=>{ a.play().catch(()=>{}); document.removeEventListener("pointerdown", once); };
        document.addEventListener("pointerdown", once, {once:true});
      });
    }catch(_){}
  }
  const left = $("wwLeft"), right = $("wwRight");
  let showLeft = true;       // which side is visible this tick
  let leftRed = true, rightRed = false;  // colour state per side
  const tick = ()=>{
    left.classList.remove("show","red","white");
    right.classList.remove("show","red","white");
    if(showLeft){
      left.classList.add("show", leftRed ? "red" : "white");
      leftRed = !leftRed;    // flip colour for next time this side shows
    } else {
      right.classList.add("show", rightRed ? "red" : "white");
      rightRed = !rightRed;
    }
    showLeft = !showLeft;
  };
  tick();
  weewooTimer = setInterval(tick, 300);
}
function stopWeeWoo(){
  if(weewooTimer){ clearInterval(weewooTimer); weewooTimer = null; }
  const a = $("weewooAudio");
  if(a){ try{ a.pause(); a.currentTime = 0; }catch(_){} }
  const left = $("wwLeft"), right = $("wwRight");
  if(left) left.classList.remove("show","red","white");
  if(right) right.classList.remove("show","red","white");
}

$("tutNext").addEventListener("click", nextTut);
$("tutSkip").addEventListener("click", closeTutorial);
$("tut").addEventListener("click", e=>{ if(e.target === $("tut")) closeTutorial(); });

/* swipe within the tutorial: left = next slide, right = previous slide */
let tutSX=0, tutSY=0, tutTrack=false, tutAxis=null, tutDX=0, tutDY=0;
const tutStage = $("tutStage");
const tutTouchTarget = $("tut");
tutTouchTarget.addEventListener("touchstart", e=>{
  const t=e.touches[0]; tutSX=t.clientX; tutSY=t.clientY; tutDX=0; tutDY=0; tutTrack=true; tutAxis=null;
}, {passive:true});
tutTouchTarget.addEventListener("touchmove", e=>{
  if(!tutTrack) return;
  const t=e.touches[0]; tutDX=t.clientX-tutSX; tutDY=t.clientY-tutSY;
  if(!tutAxis && (Math.abs(tutDX)>10 || Math.abs(tutDY)>10)){
    tutAxis = Math.abs(tutDX)>Math.abs(tutDY) ? "x" : "y";
  }
  if(tutAxis==="x") e.preventDefault();   // horizontal handled by us; vertical is locked anyway
}, {passive:false});
tutTouchTarget.addEventListener("touchend", ()=>{
  if(!tutTrack) return;
  tutTrack=false;
  if(tutAxis==="x"){
    if(tutDX < -60){ nextTut(); }       // swipe left → next
    else if(tutDX > 60){ prevTut(); }   // swipe right → previous
  }
  tutAxis=null;
});

function maybeShowTutorial(){
  let seen = false;
  try{ seen = sessionStorage.getItem("ub_tut_seen") === "1"; }catch(_){}
  if(!seen) showTutorial();
}

render();
maybeShowTutorial();
</script>
